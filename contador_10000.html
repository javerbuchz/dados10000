<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador Dados 10.000</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --active-turn: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: fit-content;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
    }

    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: -12px;
    }

    /* Setup View */
    .setup-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus {
      border-color: var(--primary);
    }

    .players-inputs {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    /* Game View */
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
    }

    .player-card {
      background: #0f172a;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      transition: all 0.3s;
      position: relative;
    }

    .player-card.active {
      border-color: var(--active-turn);
      background: rgba(245, 158, 11, 0.08);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.25);
    }

    .player-name {
      font-size: 0.95rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-score {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      margin-top: 4px;
    }

    .active-badge {
      font-size: 0.65rem;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--active-turn);
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    .turn-controls {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .current-turn-title {
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
      color: var(--active-turn);
    }

    .quick-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .btn-quick {
      background-color: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 4px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.1s;
    }

    .btn-quick:active {
      transform: scale(0.96);
      background-color: #e2e8f0;
    }

    .btn-quick.zero {
      background-color: #ef4444;
      color: #ffffff;
      border-color: #dc2626;
      grid-column: span 2;
    }

    .btn-quick.zero:active {
      background-color: #dc2626;
    }

    /* Winner Modal / View */
    .winner-box {
      text-align: center;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .trophy {
      font-size: 3.5rem;
    }

    .winner-title {
      font-size: 1.5rem;
      color: var(--active-turn);
      font-weight: 800;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Vista Configuración Inicial -->
  <div id="setup-view" class="setup-group">
    <h1>🎲 Juego 10.000</h1>
    <p class="subtitle">Anotador Oficial</p>
    
    <div>
      <label for="num-players">Cantidad de Jugadores</label>
      <select id="num-players" onchange="renderNameInputs()">
        <option value="1">1 Jugadores</option>
        <option value="2" selected>2 Jugadores</option>
        <option value="3">3 Jugadores</option>
        <option value="4">4 Jugadores</option>
        <option value="5">5 Jugadores</option>
        <option value="6">6 Jugadores</option>
      </select>
    </div>

    <div>
      <label>Nombres de los Jugadores</label>
      <div id="players-inputs" class="players-inputs" style="margin-top: 8px;"></div>
    </div>

    <button class="btn btn-primary" onclick="startGame()">Comenzar Partida</button>
  </div>

  <!-- Vista de Partida -->
  <div id="game-view" class="setup-group hidden">
    <h1>🎲 Juego 10.000</h1>
    
    <div id="scoreboard" class="scoreboard"></div>

    <div class="turn-controls">
      <div id="current-player-text" class="current-turn-title">Turno de: -</div>

      <div>
        <label for="score-input">Puntos de este turno:</label>
        <input type="number" id="score-input" value="0" min="0" step="50" style="font-size: 1.3rem; font-weight: 700; text-align: center; margin-top: 6px;">
      </div>

      <div class="quick-buttons">
        <button class="btn-quick" onclick="addScore(50)">+50</button>
        <button class="btn-quick" onclick="addScore(100)">+100</button>
        <button class="btn-quick" onclick="addScore(500)">+500</button>
        <button class="btn-quick" onclick="addScore(1000)">+1.000</button>
        <button class="btn-quick zero" onclick="setZero()">0 (nada)</button>
      </div>

      <button class="btn btn-primary" onclick="confirmTurn()">Confirmar Turno</button>
    </div>

    <button class="btn btn-secondary" onclick="resetGame()">Reiniciar Partida</button>
  </div>

  <!-- Vista Ganador -->
  <div id="winner-view" class="winner-box hidden">
    <div class="trophy">🏆</div>
    <h2 class="winner-title" id="winner-name">¡Ganador!</h2>
    <p id="winner-score" style="font-size: 1.1rem; color: var(--text-muted);"></p>
    <button class="btn btn-primary" onclick="resetGame()" style="margin-top: 12px;">Jugar de Nuevo</button>
  </div>
</div>

<script>
  let players = [];
  let currentTurn = 0;
  const TARGET_SCORE = 10000;

  function renderNameInputs() {
    const count = parseInt(document.getElementById('num-players').value);
    const container = document.getElementById('players-inputs');
    container.innerHTML = '';
    for (let i = 1; i <= count; i++) {
      const input = document.createElement('input');
      input.type = 'text';
      input.id = `player-input-${i}`;
      input.value = `Jugador ${i}`;
      container.appendChild(input);
    }
  }

  function startGame() {
    const count = parseInt(document.getElementById('num-players').value);
    players = [];
    for (let i = 1; i <= count; i++) {
      const name = document.getElementById(`player-input-${i}`).value.trim() || `Jugador ${i}`;
      players.push({ name, score: 0 });
    }
    currentTurn = 0;
    document.getElementById('setup-view').classList.add('hidden');
    document.getElementById('game-view').classList.remove('hidden');
    document.getElementById('winner-view').classList.add('hidden');
    updateUI();
  }

  function updateUI() {
    const scoreboard = document.getElementById('scoreboard');
    scoreboard.innerHTML = '';

    players.forEach((p, idx) => {
      const card = document.createElement('div');
      card.className = `player-card ${idx === currentTurn ? 'active' : ''}`;
      card.innerHTML = `
        <div class="player-name">${p.name}</div>
        <div class="player-score">${p.score.toLocaleString('es-AR')}</div>
        ${idx === currentTurn ? '<div class="active-badge">Su Turno</div>' : ''}
      `;
      scoreboard.appendChild(card);
    });

    document.getElementById('current-player-text').innerText = `Turno de: ${players[currentTurn].name}`;
    document.getElementById('score-input').value = 0;
  }

  function addScore(val) {
    const input = document.getElementById('score-input');
    let curr = parseInt(input.value) || 0;
    input.value = curr + val;
  }

  function setZero() {
    document.getElementById('score-input').value = 0;
  }

  function confirmTurn() {
    const points = parseInt(document.getElementById('score-input').value) || 0;
    players[currentTurn].score += points;

    if (players[currentTurn].score >= TARGET_SCORE) {
      document.getElementById('game-view').classList.add('hidden');
      document.getElementById('winner-view').classList.remove('hidden');
      document.getElementById('winner-name').innerText = `¡${players[currentTurn].name} ganó la partida!`;
      document.getElementById('winner-score').innerText = `Puntaje final: ${players[currentTurn].score.toLocaleString('es-AR')} pts`;
      return;
    }

    currentTurn = (currentTurn + 1) % players.length;
    updateUI();
  }

  function resetGame() {
    document.getElementById('setup-view').classList.remove('hidden');
    document.getElementById('game-view').classList.add('hidden');
    document.getElementById('winner-view').classList.add('hidden');
    renderNameInputs();
  }

  // Inicializar inputs
  renderNameInputs();
</script>

</body>
</html>
